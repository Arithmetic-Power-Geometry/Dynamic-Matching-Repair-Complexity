name: CAIDA Shadow Full Replay
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/caida-shadow-full.yml'
      - 'artifacts/reconstruct_caida.py'
      - 'artifacts/replay_shadow_epoch.py'
      - 'artifacts/analyze_discovery_profile.py'
      - 'artifacts/summarize_shadow_epoch.py'
      - 'src/shadow_epoch.py'
      - 'src/dirty_shadow_epoch.py'
jobs:
  caida-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download authoritative SNAP archive
        run: |
          mkdir -p data results
          curl -fL --retry 5 --retry-delay 5 https://snap.stanford.edu/data/as-caida.tar.gz -o data/as-caida.tar.gz
          ls -lh data/as-caida.tar.gz
      - name: Reconstruct and enforce frozen benchmark gate
        run: |
          python artifacts/reconstruct_caida.py data/as-caida.tar.gz --out data/caida_projected.csv | tee results/caida_reconstruction_gate.txt
      - name: Shadow replay
        run: |
          python artifacts/replay_shadow_epoch.py data/caida_projected.csv --out results/caida_shadow_events.csv | tee results/caida_shadow_replay.txt
      - name: Discovery profile
        run: |
          python artifacts/analyze_discovery_profile.py results/caida_shadow_events.csv --dataset SNAP_AS_CAIDA_122 --out results/caida_discovery_profile.csv | tee results/caida_discovery_profile.txt
      - name: Compact shadow summary
        run: |
          python artifacts/summarize_shadow_epoch.py results/caida_shadow_events.csv --dataset SNAP_AS_CAIDA_122 --out results/caida_shadow_summary.csv
      - uses: actions/upload-artifact@v4
        with:
          name: caida-shadow-results
          path: |
            results/caida_reconstruction_gate.txt
            results/caida_shadow_replay.txt
            results/caida_discovery_profile.csv
            results/caida_discovery_profile.txt
            results/caida_shadow_summary.csv
          retention-days: 30
