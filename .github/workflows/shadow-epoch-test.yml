name: Shadow Epoch Replay Test
on:
  push:
    paths:
      - 'src/shadow_epoch.py'
      - 'artifacts/replay_shadow_epoch.py'
      - 'experiments/test_shadow_replay.py'
      - 'experiments/fixtures/shadow_small.csv'
      - '.github/workflows/shadow-epoch-test.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python experiments/test_shadow_replay.py
